name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax-check the release build script
        run: python -m py_compile build_release.py
      - name: Confirm ship-exclusion safeguards are present
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('build_release.py').read_text(encoding='utf-8')
          assert 'amd_ags_x64.dll' in t, 'game-DLL exclusion list missing'
          assert 'StoreRobberyEnhanced' in t, 'no-redistributable mod list missing'
          assert '_DLSS5_Backup' in t, 'DLSS5 backup exclusion missing'
          print('exclusion safeguards present in build_release.py')
          PY
